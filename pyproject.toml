[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ged-editor"
version = "0.1.0"
description = "Desktop application scaffold for genealogical record editing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
ged-editor = "ged_editor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
